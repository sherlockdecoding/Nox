<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>NOX | Digital Detective Assistant</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Merriweather:wght@300;400;700&family=Inter:wght@300;400;600&family=JetBrains+Mono:wght@400;500&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <style>
        :root {
            --bg-primary: #121212;
            --bg-secondary: #1a1a1a;
            --bg-tertiary: #242424;
            --text-primary: #e0e0e0;
            --text-secondary: #a0a0a0;
            --accent-color: #455a64;
            --accent-red: #8b0000;
            --accent-glow: rgba(139,0,0,0.4);
            --accent-glow-soft: rgba(139,0,0,0.15);
            --border-color: #2c2c2c;
            --cursor-color: #8b0000;
            --font-serif: 'Merriweather', serif;
            --font-sans: 'Inter', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --header-height: 60px;
            --sidebar-width: 280px;
        }
        [data-theme="phantom"] {
            --bg-primary: #f0ede8;
            --bg-secondary: #e8e4dd;
            --bg-tertiary: #ddd8cf;
            --text-primary: #1a1612;
            --text-secondary: #6b6560;
            --accent-color: #8c7b6a;
            --accent-red: #4a1a0a;
            --accent-glow: rgba(74,26,10,0.2);
            --accent-glow-soft: rgba(74,26,10,0.08);
            --border-color: #c8c0b4;
            --cursor-color: #4a1a0a;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: var(--font-sans);
            height: 100dvh;
            display: flex;
            overflow: hidden;
            position: fixed;
            width: 100%;
            transition: background-color 0.4s ease, color 0.4s ease;
        }
        .nox-brand { font-family: var(--font-serif); font-weight: 700; font-size: 1.4rem; letter-spacing: 4px; color: var(--text-primary); text-shadow: 0 0 8px var(--accent-glow); text-transform: uppercase; transition: text-shadow 0.4s ease; }
        .app-container { display: flex; width: 100%; height: 100%; position: relative; overflow: hidden; }
        .sidebar-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 10; display: none; opacity: 0; transition: opacity 0.3s ease; }
        .sidebar-overlay.active { display: block; opacity: 1; }
        .sidebar { position: fixed; left: -100%; top: 0; width: var(--sidebar-width); height: 100%; background-color: var(--bg-secondary); border-right: 1px solid var(--border-color); z-index: 20; display: flex; flex-direction: column; overflow: hidden; transition: left 0.3s ease, background-color 0.4s ease, border-color 0.4s ease; }
        .sidebar.open { left: 0; }
        .sidebar-header { height: var(--header-height); padding: 0 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-color); }
        .close-sidebar-btn { background: none; border: none; color: var(--text-secondary); font-size: 1.2rem; cursor: pointer; }
        .new-case-btn { margin: 20px 20px 10px 20px; padding: 12px; background-color: transparent; border: 1px solid var(--accent-color); color: var(--text-primary); font-family: var(--font-sans); border-radius: 4px; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .new-case-btn:hover { background-color: var(--accent-color); }

        /* ── HUB LAUNCH MODULES ── */
        .lab-launch-btn, .agent-launch-btn {
            margin: 6px 20px 0 20px; padding: 11px 12px;
            background: transparent;
            font-family: var(--font-mono);
            font-size: 0.72rem;
            letter-spacing: 2px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.25s;
            display: flex;
            align-items: center;
            gap: 10px;
            text-transform: uppercase;
        }
        .lab-launch-btn {
            border: 1px solid rgba(0,212,255,0.3);
            color: rgba(0,212,255,0.75);
        }
        .lab-launch-btn:hover {
            border-color: rgba(0,212,255,0.8); color: #00d4ff; background: rgba(0,212,255,0.07); box-shadow: 0 0 12px rgba(0,212,255,0.2);
        }
        .lab-launch-btn .lab-dot {
            width: 7px; height: 7px; border-radius: 50%; background: rgba(0,212,255,0.6); animation: lab-pulse 2s ease-in-out infinite; flex-shrink: 0;
        }
        .agent-launch-btn {
            border: 1px solid rgba(255,255,255,0.15);
            color: rgba(255,255,255,0.6);
            margin-bottom: 14px;
        }
        .agent-launch-btn:hover {
            border-color: rgba(255,255,255,0.8); color: #ffffff; background: rgba(255,255,255,0.05); box-shadow: 0 0 12px rgba(255,255,255,0.1);
        }
        .agent-launch-btn .agent-dot {
            width: 7px; height: 7px; border-radius: 50%; background: #ffffff; box-shadow: 0 0 8px #fff; flex-shrink: 0;
        }
        @keyframes lab-pulse { 0%,100%{opacity:0.5;transform:scale(1);} 50%{opacity:1;transform:scale(1.3);} }

        .sidebar-theme-section { padding: 12px 20px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; gap: 12px; }
        .sidebar-theme-toggle { width: 50px; height: 28px; background: var(--bg-tertiary); border: 1px solid var(--border-color); border-radius: 14px; cursor: pointer; display: flex; align-items: center; padding: 2px; transition: all 0.3s ease; position: relative; flex-shrink: 0; }
        .sidebar-theme-toggle::after { content: ''; width: 22px; height: 22px; background: var(--text-primary); border-radius: 50%; position: absolute; left: 2px; transition: left 0.3s ease; }
        .sidebar-theme-toggle:hover { border-color: var(--text-primary); }
        [data-theme="phantom"] .sidebar-theme-toggle::after { left: 26px; }
        .sidebar-theme-tooltip { font-family: var(--font-mono); font-size: 0.7rem; color: var(--text-secondary); letter-spacing: 1px; }
        .archive-section { flex-grow: 1; overflow-y: auto; padding: 0 10px; padding-top: 14px; }
        .archive-title { font-family: var(--font-mono); font-size: 0.75rem; color: var(--accent-red); padding: 0 10px; margin-bottom: 10px; letter-spacing: 1px; }
        .case-list { list-style: none; min-height: 20px; }
        .case-item { padding: 12px 10px; margin-bottom: 5px; border-radius: 4px; cursor: pointer; transition: background 0.2s; position: relative; overflow: hidden; display: flex; justify-content: space-between; align-items: center; user-select: none; -webkit-user-select: none; }
        .case-item:hover { background-color: var(--bg-tertiary); }
        .case-item.active { background-color: var(--bg-tertiary); border-left: 3px solid var(--accent-red); }
        .case-item-text { font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-grow: 1; pointer-events: none; }
        .case-delete-btn { background: none; border: none; color: var(--accent-red); cursor: pointer; font-size: 1rem; padding: 5px; display: none; margin-left: 10px; }
        .case-item.show-delete .case-delete-btn { display: block; }
        .main-content { flex: 1; display: flex; flex-direction: column; height: 100%; position: relative; transition: margin-left 0.3s ease; width: 100%; min-width: 0; }
        .main-header { height: var(--header-height); padding: 0 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-color); background-color: var(--bg-primary); flex-shrink: 0; transition: background-color 0.4s ease, border-color 0.4s ease; }
        .header-left, .header-right { display: flex; align-items: center; gap: 15px; }
        .icon-btn { background: none; border: none; color: var(--text-secondary); font-size: 1.2rem; cursor: pointer; transition: color 0.2s; }
        .icon-btn:hover { color: var(--text-primary); }
        .icon-btn.active { color: var(--accent-red); }
        .case-info { font-family: var(--font-mono); font-size: 0.85rem; text-align: center; }
        .chat-container { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 25px; scrollbar-width: thin; -webkit-overflow-scrolling: touch; }
        #evidence-board { display: none; flex: 1; width: 100%; height: 100%; background-color: var(--bg-primary); position: relative; }
        .message { max-width: 85%; line-height: 1.6; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .msg-header { font-family: var(--font-mono); font-size: 0.7rem; margin-bottom: 5px; letter-spacing: 1px; color: var(--accent-red); }
        .msg-content { background-color: var(--bg-secondary); padding: 15px 20px; border-radius: 2px; border-left: 3px solid var(--accent-color); font-family: var(--font-serif); font-size: 1.05rem; box-shadow: 0 4px 6px rgba(0,0,0,0.1); white-space: pre-wrap; transition: background-color 0.4s ease, border-color 0.4s ease; }
        .message.user-msg { align-self: flex-end; }
        .message.user-msg .msg-header { color: var(--text-secondary); text-align: right; }
        .message.user-msg .msg-content { background-color: var(--bg-tertiary); border-left: none; border-right: 3px solid var(--accent-color); font-family: var(--font-sans); font-size: 0.95rem; }
        .typing-cursor { display: inline-block; width: 2px; height: 1.1em; background: var(--cursor-color); margin-left: 2px; vertical-align: text-bottom; animation: blink-cursor 0.75s step-end infinite; box-shadow: 0 0 6px var(--accent-glow); }
        @keyframes blink-cursor { 0%,100%{opacity:1;} 50%{opacity:0;} }
        .thinking-dots { display: inline-flex; gap: 5px; align-items: center; height: 1.2em; vertical-align: middle; }
        .thinking-dots span { width: 6px; height: 6px; border-radius: 50%; background: var(--accent-red); animation: dot-bounce 1.2s ease-in-out infinite; box-shadow: 0 0 6px var(--accent-glow); }
        .thinking-dots span:nth-child(1) { animation-delay: 0s; }
        .thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
        .thinking-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes dot-bounce { 0%,80%,100%{transform:scale(0.6);opacity:0.4;} 40%{transform:scale(1);opacity:1;} }
        .gravatar-info { display: flex; align-items: center; gap: 15px; margin-top: 15px; padding: 12px; background: rgba(0,0,0,0.3); border: 1px solid var(--border-color); border-radius: 4px; }
        .gravatar-img { width: 50px; height: 50px; border-radius: 4px; border: 1px solid var(--accent-color); }
        .gravatar-name { font-family: var(--font-mono); font-size: 0.8rem; color: var(--text-primary); letter-spacing: 1px; }
        .nox-map-block { margin-top: 16px; border: 1px solid var(--accent-color); border-radius: 3px; overflow: hidden; background: #0d0d0d; }
        .nox-map-header { background: var(--accent-glow-soft); border-bottom: 1px solid var(--accent-color); padding: 8px 14px; display: flex; align-items: center; gap: 10px; font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 1.5px; color: var(--accent-red); }
        .nox-map-header .blink { width: 7px; height: 7px; border-radius: 50%; background: var(--accent-red); animation: blink-dot 1.2s infinite; }
        @keyframes blink-dot { 0%,100%{opacity:1;} 50%{opacity:0.2;} }
        .nox-map-canvas { width: 100%; height: 220px; }
        .nox-map-footer { padding: 10px 14px; font-family: var(--font-mono); font-size: 0.7rem; color: var(--text-secondary); border-top: 1px solid var(--border-color); line-height: 1.7; }
        .nox-map-footer .coord-line { color: #7fba8a; }
        .nox-map-footer .alt-line { color: var(--text-secondary); }
        .nox-map-footer .alt-line span { color: #c8a96e; }
        .ip-card { margin-top: 15px; border: 1px solid var(--accent-color); border-radius: 3px; background: rgba(0,0,0,0.3); overflow: hidden; font-family: var(--font-mono); }
        .ip-card-header { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--accent-glow-soft); border-bottom: 1px solid var(--border-color); }
        .ip-flag { border: 1px solid var(--border-color); border-radius: 2px; flex-shrink: 0; }
        .ip-address { font-size: 0.85rem; color: #7fba8a; letter-spacing: 1px; flex-grow: 1; }
        .ip-tag { font-size: 0.65rem; padding: 2px 6px; border-radius: 2px; letter-spacing: 1px; }
        .ip-tag.proxy { background: rgba(139,0,0,0.4); color: #ff6b6b; border: 1px solid #8b0000; }
        .ip-tag.hosting { background: rgba(69,90,100,0.4); color: #aac; border: 1px solid #455a64; }
        .ip-grid { padding: 10px 14px; display: flex; flex-direction: column; gap: 5px; }
        .ip-row { display: flex; gap: 12px; font-size: 0.72rem; }
        .ip-k { color: var(--accent-red); min-width: 72px; flex-shrink: 0; }
        .ip-v { color: var(--text-primary); word-break: break-all; }
        .osint-card { margin-top: 15px; border: 1px solid var(--accent-color); border-radius: 3px; background: rgba(0,0,0,0.3); overflow: hidden; font-family: var(--font-mono); }
        .osint-card-header { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--accent-glow-soft); border-bottom: 1px solid var(--border-color); font-size: 0.72rem; letter-spacing: 1.5px; color: var(--accent-red); }
        .osint-card-header .blink { width: 7px; height: 7px; border-radius: 50%; background: var(--accent-red); animation: blink-dot 1.2s infinite; flex-shrink: 0; }
        .osint-card-title { flex-grow: 1; }
        .osint-grid { padding: 10px 14px; display: flex; flex-direction: column; gap: 5px; }
        .osint-row { display: flex; gap: 12px; font-size: 0.72rem; border-bottom: 1px solid rgba(255,255,255,0.04); padding-bottom: 4px; }
        .osint-k { color: var(--accent-red); min-width: 90px; flex-shrink: 0; }
        .osint-v { color: var(--text-primary); word-break: break-all; line-height: 1.5; }
        .osint-v a { color: #7fba8a; text-decoration: none; }
        .osint-v a:hover { text-decoration: underline; }
        .osint-section-title { font-size: 0.68rem; color: var(--text-secondary); letter-spacing: 1px; margin: 8px 0 4px; }
        .username-grid { padding: 10px 14px; display: flex; flex-wrap: wrap; gap: 6px; }
        .username-chip { font-size: 0.68rem; padding: 4px 8px; border-radius: 2px; letter-spacing: 0.5px; display: flex; align-items: center; gap: 5px; }
        .username-chip.found { background: rgba(127,186,138,0.15); border: 1px solid #7fba8a; color: #7fba8a; }
        .username-chip.notfound { background: rgba(255,255,255,0.04); border: 1px solid #333; color: #555; }
        .username-chip .dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }
        .username-chip.found .dot { background: #7fba8a; }
        .username-chip.notfound .dot { background: #444; }
        .breach-list { padding: 10px 14px; display: flex; flex-direction: column; gap: 6px; }
        .breach-item { font-size: 0.72rem; padding: 6px 10px; border-radius: 2px; border-left: 3px solid var(--accent-red); background: rgba(139,0,0,0.1); }
        .breach-name { color: #ff6b6b; margin-bottom: 2px; }
        .exif-upload-area { margin-top: 15px; border: 1px dashed var(--accent-color); border-radius: 3px; padding: 20px; text-align: center; cursor: pointer; font-family: var(--font-mono); font-size: 0.8rem; color: var(--text-secondary); transition: all 0.2s; background: rgba(0,0,0,0.2); }
        .exif-upload-area:hover { border-color: var(--accent-red); color: var(--text-primary); }
        .img-upload-label { cursor: pointer; display: flex; align-items: center; justify-content: center; }
        #img-upload-input { display: none; }
        .disclaimer { text-align: center; font-family: var(--font-mono); font-size: 0.62rem; color: var(--text-secondary); opacity: 0.4; padding-top: 6px; letter-spacing: 0.5px; user-select: none; -webkit-user-select: none; }

        /* ── SIDEBAR COPYRIGHT ── */
        .sidebar-copyright { padding: 14px 20px 20px 20px; border-top: 1px solid var(--border-color); flex-shrink: 0; }
        .sidebar-copyright p { font-family: var(--font-mono); font-size: 0.58rem; color: var(--text-secondary); letter-spacing: 0.8px; line-height: 1.9; opacity: 0.38; user-select: none; -webkit-user-select: none; transition: color 0.4s ease; }
        .sidebar-copyright .copy-brand { font-size: 0.66rem; letter-spacing: 3px; color: var(--accent-red); opacity: 0.55; }

        /* ── SPLASH ── */
        .splash { position: fixed; inset: 0; z-index: 99999; background: var(--bg-primary); display: flex; align-items: center; justify-content: center; overflow: hidden; animation: splash-exit 0.6s ease 3.5s forwards; }
        @keyframes splash-exit { 0%{opacity:1;pointer-events:auto;} 100%{opacity:0;pointer-events:none;} }
        .splash-scanline { position: absolute; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent, var(--accent-glow), transparent); animation: scanline 2.5s linear 1s infinite; }
        @keyframes scanline { 0%{top:0%;opacity:0;} 5%{opacity:1;} 95%{opacity:1;} 100%{top:100%;opacity:0;} }
        .splash-inner { display: flex; flex-direction: column; align-items: center; gap: 18px; }
        .splash-bars { display: flex; gap: 8px; align-items: flex-end; height: 40px; margin-bottom: 8px; }
        .splash-bar { width: 4px; border-radius: 4px; background: var(--accent-red); box-shadow: 0 0 12px var(--accent-glow); animation: splash-bar-rise 0.6s ease forwards; transform-origin: bottom; opacity: 0; }
        .splash-bar:nth-child(1) { height: 20px; animation-delay: 0.1s; animation-duration: 0.5s; }
        .splash-bar:nth-child(2) { height: 36px; animation-delay: 0.25s; animation-duration: 0.5s; }
        .splash-bar:nth-child(3) { height: 26px; animation-delay: 0.4s; animation-duration: 0.5s; }
        @keyframes splash-bar-rise { from{opacity:0;transform:scaleY(0);} to{opacity:1;transform:scaleY(1);} }
        .splash-logo { font-family: 'Merriweather', serif; font-weight: 700; font-size: clamp(3.5rem, 12vw, 6rem); letter-spacing: 18px; color: var(--text-primary); text-shadow: 0 0 40px var(--accent-glow), 0 0 80px var(--accent-glow-soft); animation: splash-logo-in 1s cubic-bezier(0.16,1,0.3,1) 0.4s both; text-transform: uppercase; }
        @keyframes splash-logo-in { 0%{opacity:0;letter-spacing:80px;filter:blur(8px);} 50%{opacity:0.8;letter-spacing:12px;filter:blur(1px);} 75%{letter-spacing:20px;} 100%{opacity:1;letter-spacing:18px;filter:blur(0);} }
        .splash-sub { font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; letter-spacing: 5px; color: var(--accent-red); text-transform: uppercase; animation: splash-sub-in 0.6s ease 1.3s both; }
        @keyframes splash-sub-in { from{opacity:0;transform:translateY(6px);} to{opacity:1;transform:translateY(0);} }
        .splash-line { height: 1px; background: linear-gradient(90deg, transparent, var(--accent-red), transparent); animation: splash-line-grow 0.8s ease 1.8s both; width: 0; }
        @keyframes splash-line-grow { from{width:0;opacity:0;} to{width:260px;opacity:1;} }
        .leaflet-container { background: #0d0d0d !important; }
        .leaflet-tile { filter: invert(1) hue-rotate(180deg) brightness(0.75) contrast(1.1); }
        .leaflet-control-zoom a { background: var(--bg-secondary) !important; color: var(--text-primary) !important; border-color: var(--border-color) !important; }
        .input-area { flex-shrink: 0; padding: 10px 15px calc(10px + env(safe-area-inset-bottom)); background-color: var(--bg-primary); border-top: 1px solid var(--border-color); width: 100%; transition: background-color 0.4s ease, border-color 0.4s ease; }
        .input-wrapper { background-color: var(--bg-secondary); border: 1px solid var(--border-color); padding: 10px 15px; display: flex; gap: 12px; align-items: center; border-radius: 4px; transition: background-color 0.4s ease, border-color 0.4s ease; }
        textarea { flex-grow: 1; background: transparent; border: none; color: var(--text-primary); font-family: var(--font-sans); font-size: 16px; resize: none; max-height: 120px; outline: none; padding: 5px 0; line-height: 1.4; }
        #send-btn { background: transparent; border: none; color: var(--accent-color); font-size: 1.3rem; cursor: pointer; padding: 5px; display: flex; align-items: center; justify-content: center; }
        @media (min-width: 768px) { .input-area { padding: 20px 40px 40px 40px; } }
        #node-delete-btn { position: absolute; display: none; background: var(--accent-red); color: white; border: none; border-radius: 50%; width: 30px; height: 30px; cursor: pointer; z-index: 100; justify-content: center; align-items: center; box-shadow: 0 0 10px rgba(0,0,0,0.5); font-size: 14px; }
        .call-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(18,18,18,0.96); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; backdrop-filter: blur(8px); }
        .call-overlay.active { opacity: 1; pointer-events: auto; }
        .call-status { font-family: var(--font-mono); color: var(--text-secondary); margin-bottom: 50px; letter-spacing: 2px; text-transform: uppercase; font-size: 1rem; }
        .spectrum-container { display: flex; align-items: center; gap: 10px; height: 120px; margin-bottom: 80px; }
        .spectrum-bar { width: 14px; height: 20px; background-color: var(--accent-red); border-radius: 8px; transition: height 0.15s ease; box-shadow: 0 0 15px var(--accent-glow); }
        .spectrum-container.active .spectrum-bar { animation: pulse-wave 1.2s ease-in-out infinite; }
        .spectrum-container.active .spectrum-bar:nth-child(1) { animation-delay: 0.0s; }
        .spectrum-container.active .spectrum-bar:nth-child(2) { animation-delay: 0.15s; }
        .spectrum-container.active .spectrum-bar:nth-child(3) { animation-delay: 0.3s; }
        .spectrum-container.active .spectrum-bar:nth-child(4) { animation-delay: 0.45s; }
        .spectrum-container.active .spectrum-bar:nth-child(5) { animation-delay: 0.6s; }
        @keyframes pulse-wave { 0%,100%{height:20px;} 50%{height:100px;} }
        .call-controls { display: flex; gap: 50px; align-items: center; }

<script>

//  HUB INTEGRATIONS (LAB & AGENT MODE)
// ─────────────────────────────────────────────
const labOverlay = document.getElementById('lab-overlay');
const labFrame = document.getElementById('lab-frame');
const labLaunchBtn = document.getElementById('lab-launch-btn');
const labCloseBtn = document.getElementById('lab-close-btn');

const agentOverlay = document.getElementById('agent-overlay');
const agentFrame = document.getElementById('agent-frame');
const agentLaunchBtn = document.getElementById('agent-launch-btn');
const agentCloseBtn = document.getElementById('agent-close-btn');

let labBlobUrl = null;
let agentBlobUrl = null;

const openLab = () => {
    if (!labBlobUrl) {
        const tpl = document.getElementById('lab-html-tpl');
        const blob = new Blob([tpl.innerHTML], { type: 'text/html' });
        labBlobUrl = URL.createObjectURL(blob);
    }
    labFrame.src = labBlobUrl;
    labOverlay.classList.add('active');
    closeSidebarMenu();
};

const openAgentHub = () => {
    if (!agentBlobUrl) {
        const tpl = document.getElementById('agent-html-tpl');
        const blob = new Blob([tpl.innerHTML], { type: 'text/html' });
        agentBlobUrl = URL.createObjectURL(blob);
    }
    agentFrame.src = agentBlobUrl;
    agentOverlay.classList.add('active');
    closeSidebarMenu();
};

const closeSidebarMenu = () => {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('sidebar-overlay').classList.remove('active');
};

labLaunchBtn.addEventListener('click', openLab);
labCloseBtn.addEventListener('click', () => { labOverlay.classList.remove('active'); labFrame.src = 'about:blank'; });

agentLaunchBtn.addEventListener('click', openAgentHub);
agentCloseBtn.addEventListener('click', () => { agentOverlay.classList.remove('active'); agentFrame.src = 'about:blank'; });

// ─────────────────────────────────────────────
//  CORE NOX SYSTEM LOGIC
// ─────────────────────────────────────────────
const API_URL = "https://hermes.ai.unturf.com/v1/chat/completions";
const chatContainer = document.getElementById('chat-container');
const userInput = document.getElementById('user-input');
const sendBtn = document.getElementById('send-btn');
const caseIdDisplay = document.getElementById('case-id-display');
const caseListEl = document.getElementById('case-list');
const sidebar = document.getElementById('sidebar');
const sidebarOverlay = document.getElementById('sidebar-overlay');
const menuBtn = document.getElementById('menu-btn');
const closeSidebarBtn = document.getElementById('close-sidebar');
const themeToggleBtn = document.getElementById('theme-toggle-btn');
const themeLabel = document.getElementById('theme-label');

let cases = [];
let currentCaseId = null;
let currentTheme = 'default';

const applyTheme = (theme) => {
    currentTheme = theme;
    document.documentElement.setAttribute('data-theme', theme === 'default' ? '' : theme);
    localStorage.setItem('nox_theme', theme);
    themeLabel.textContent = theme === 'default' ? 'DARK MODE' : 'LIGHT MODE';
};
themeToggleBtn.addEventListener('click', () => applyTheme(currentTheme === 'default' ? 'phantom' : 'default'));

menuBtn.addEventListener('click', () => { sidebar.classList.add('open'); sidebarOverlay.classList.add('active'); });
closeSidebarBtn.addEventListener('click', closeSidebarMenu);
sidebarOverlay.addEventListener('click', closeSidebarMenu);

const init = () => {
    applyTheme(localStorage.getItem('nox_theme') || 'default');
    const stored = localStorage.getItem('nox_cases');
    if (stored) {
        cases = JSON.parse(stored);
        currentCaseId = localStorage.getItem('nox_active_case') || cases[0].id;
    } else {
        currentCaseId = 'NX-START-LOG';
        cases = [{ id: currentCaseId, title: 'Initial Case Log', messages: [{ role: 'assistant', content: 'System active. Neural links established. Standing by for operations.' }] }];
    }
    renderChat();
};

const renderChat = () => {
    chatContainer.innerHTML = '';
    const activeCase = cases.find(c => c.id === currentCaseId);
    if (activeCase) {
        caseIdDisplay.textContent = activeCase.id;
        activeCase.messages.forEach(msg => {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${msg.role}-msg`;
            msgDiv.innerHTML = `<div class="msg-header">${msg.role === 'assistant' ? 'NOX_UNIT' : 'OPERATOR'}</div><div class="msg-content">${msg.content}</div>`;
            chatContainer.appendChild(msgDiv);
        });
    }
};

window.addEventListener('DOMContentLoaded', init);
</script>
